version: '3.8'

services:
  # Nacos服务注册与发现中心
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    ports:
      - "8848:8848"
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - fire-network
  
  # PostgreSQL数据库
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fire_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fire-network
  
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - fire-network
  
  # RocketMQ消息队列
  rocketmq-namesrv:
    image: rocketmqinc/rocketmq:4.9.4
    container_name: rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv:/home/rocketmq/logs
    networks:
      - fire-network
  
  rocketmq-broker:
    image: rocketmqinc/rocketmq:4.9.4
    container_name: rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    command: sh mqbroker -n rocketmq-namesrv:9876
    volumes:
      - rocketmq-broker:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    networks:
      - fire-network
  
  # MinIO文件存储
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - fire-network

volumes:
  nacos-data:
  postgres-data:
  redis-data:
  rocketmq-namesrv:
  rocketmq-broker:
  rocketmq-broker-store:
  minio-data:

networks:
  fire-network:
    driver: bridge